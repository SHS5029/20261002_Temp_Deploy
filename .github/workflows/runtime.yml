name: Weather MCP CI CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "CI 성공 후 EC2에 배포 (main Branch에서만 동작)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            frontend/requirements.txt
            mcp_server/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q backend/app.py backend/test_app.py frontend/app.py mcp_server/server.py

      # 실제 LLM·날씨 API 대신 Fake MCP·Fake LLM으로 응답 계약만 검증합니다.
      - name: Test backend contract
        working-directory: backend
        run: python -m pytest test_app.py -q

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build three images
        run: docker compose build

      # API Key 없이도 Health Check는 통과하므로 Secret 없이 전체 Stack 기동을 확인합니다.
      - name: Smoke test Compose stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health

      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: AWS
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    env:
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_USER: ${{ secrets.AWS_USER }}
      REMOTE_DIR: weather-mcp-deployment
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          for name in AWS_HOST AWS_USER AWS_SSH_PRIVATE_KEY AWS_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::AWS Environment Secret $name 이(가) 비어 있습니다."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $AWS_HOST
            User $AWS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      # EC2의 .env는 복사하거나 덮어쓰지 않습니다. --delete는 전송한 폴더 안에만 적용됩니다.
      - name: Copy source to EC2
        run: |
          ssh deploy-target "mkdir -p ~/$REMOTE_DIR"
          rsync -az --delete backend frontend mcp_server compose.yml "deploy-target:$REMOTE_DIR/"

      - name: Deploy with Compose
        run: |
          ssh deploy-target "REMOTE_DIR=$REMOTE_DIR bash -s" <<'EOF'
          set -euo pipefail
          cd ~/"$REMOTE_DIR"
          if [ ! -f .env ]; then
            echo "::error::EC2의 ~/$REMOTE_DIR/.env 가 없습니다. deploy/README.md를 참고해 먼저 준비하세요."
            exit 1
          fi
          docker compose config --quiet
          if ! docker compose up -d --build --wait --wait-timeout 300 --remove-orphans; then
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read().decode())"
          docker compose ps
          docker image prune -f --filter label=com.docker.compose.project=weather-mcp-deployment
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
